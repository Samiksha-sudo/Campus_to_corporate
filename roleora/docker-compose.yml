version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: roleora_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: roleora_dev
      MYSQL_USER: roleora
      MYSQL_PASSWORD: roleora_password
    ports:
      - '3306:3306'
    volumes:
      - roleora_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

volumes:
  roleora_mysql_data:
    driver: local
